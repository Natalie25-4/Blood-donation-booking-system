name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BloodDonation.sln

      - name: Build
        run: dotnet build BloodDonation.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test BloodDonation.sln --no-build --configuration Release --verbosity normal
